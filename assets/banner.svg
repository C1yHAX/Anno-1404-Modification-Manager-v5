<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="Anno 1404 Modification Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1f2e"/>
      <stop offset="0.55" stop-color="#10384a"/>
      <stop offset="1" stop-color="#0a2a36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4d27a"/>
      <stop offset="0.5" stop-color="#e0b34a"/>
      <stop offset="1" stop-color="#c9952a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21d4b4" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#21d4b4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b6cff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="820" height="240" rx="18" fill="url(#bg)"/>

  <!-- decorative waves -->
  <path d="M0 196 C 140 170, 260 222, 410 196 S 680 170, 820 196" fill="none" stroke="url(#wave)" stroke-width="3"/>
  <path d="M0 212 C 150 188, 270 236, 420 212 S 690 188, 820 212" fill="none" stroke="url(#wave)" stroke-width="2" opacity="0.6"/>

  <!-- crest / sail emblem -->
  <g transform="translate(70 120)">
    <circle r="56" fill="#0e2a38" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- hull -->
    <path d="M-34 26 L34 26 L24 44 L-24 44 Z" fill="url(#gold)"/>
    <!-- mast -->
    <rect x="-2" y="-44" width="4" height="74" fill="#e8d9b5"/>
    <!-- sails -->
    <path d="M2 -40 C 34 -30, 34 6, 2 14 Z" fill="#f1e7cf"/>
    <path d="M-2 -34 C -30 -26, -30 4, -2 12 Z" fill="#d9c8a0"/>
    <!-- sun/coin -->
    <circle cx="0" cy="-14" r="7" fill="#c9952a"/>
  </g>

  <!-- title -->
  <text x="156" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#gold)" letter-spacing="0.5">Anno 1404</text>
  <text x="158" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#eef4f6">Modification Manager</text>
  <text x="160" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9fc2cf">Mods für Klassik &amp; History Edition – ohne Handarbeit am RDA-Archiv</text>

  <!-- version chip -->
  <g transform="translate(700 40)">
    <rect x="0" y="0" width="86" height="30" rx="15" fill="#7b6cff"/>
    <text x="43" y="20" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">v5.0</text>
  </g>
</svg>
